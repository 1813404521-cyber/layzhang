    {text:"说不完的话死卡在嘴里，等你回来再说",scores:{yanxiaolai:3,caimingjun:3}},
    {text:"情绪隐藏得很好，内心却已开始筹划去找你",scores:{ningshu:3,hean:3}},
    {text:"孤独承受着，相信等待的意义",scores:{xiaoma:3,zhuqizhen:3}}]},
  {q:"如果可以穿越时间，你想对年轻的TA说什么？",opts:[
    {text:"“勇敢说，勇敢做。”",scores:{yanxiaolai:5,hean:3}},
    {text:"对他微笑，比一个爱心。",scores:{xiaoma:5}},
    {text:"“不要执着。”",scores:{xiaoxing:3,ningshu:3}},
    {text:"“不要轻信。”",scores:{pansheng:3,zhuqizhen:5}}]},
  {q:"你希望TA如何度过人生的至暗时刻：",opts:[
    {text:"心中有一个非实现不可的目标",scores:{hean:3,ningshu:3}},
    {text:"想你",scores:{yanxiaolai:3,eryuehong:3}},
    {text:"内心深处的任务和使命感",scores:{xiaoma:3,linhao:3}},
    {text:"把忍耐变成了习惯",scores:{zhuqizhen:3,ningshu:3}}]}
];

var step=0,scores={},shuffled=[];
var app=document.getElementById('app');

function hexA(h,a){return 'rgba('+parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16)+','+a+')';}
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}

function renderStart(){
  app.innerHTML='<div class="fade-up" style="text-align:center">'+
    '<div class="logo">莲莲· 角色宇宙</div>'+
    '<div class="deco">🎬</div>'+
    '<div style="font-size:22px;letter-spacing:6px;margin-bottom:10px;opacity:.6">💜 🐚 🌸 🐚 💜</div>'+
    '<h1 style="font-size:22px;font-weight:700;margin-bottom:6px;background:linear-gradient(90deg,#d066ff,#ff6eb0,#ffb3e0);-webkit-background-clip:text;-webkit-text-fill-color:transparent">老婆在哪里？</h1>'+
    '<p style="font-size:13px;color:rgba(100,60,160,.5);line-height:1.7;margin-bottom:4px">二月红 · 林浩 · 潘生 · 小兴 · 庄睿 · 蔡明骏</p>'+
    '<p style="font-size:13px;color:rgba(100,60,160,.5);line-height:1.7;margin-bottom:8px">小马 · 宁恕 · 朱祁镇 · 严小赖 · 何岸</p>'+
    '<p style="font-size:13px;color:rgba(100,60,160,.4);margin-bottom:36px">🌺 16 道题，测测你的天选莲咪🌺</p>'+
    '<button class="sbtn" onclick="startQuiz()">💗 开始测试</button></div>';
}

function renderQuestion(){
  var q=shuffled[step-1],pct=(step/shuffled.length)*100;
  var h='<div class="fade-up">'+
    '<div class="logo">莲莲· 角色宇宙</div>'+
    '<div style="font-size:13px;color:rgba(100,60,160,.45);margin-bottom:8px">🌸 '+step+' / '+shuffled.length+' 🌸</div>'+
    '<div class="pbar"><div class="pfill" style="width:'+pct+'%"></div></div>'+
    '<h2 style="font-size:18px;font-weight:600;line-height:1.6;margin-bottom:24px;color:#2d0d5a">'+q.q+'</h2>';
  for(var i=0;i<q.opts.length;i++) h+='<button class="opt" onclick="pick('+i+')">'+q.opts[i].text+'</button>';
  app.innerHTML=h+'</div>';
}

function renderResult(){
  var sorted=[];
  for(var k in scores) sorted.push([k,scores[k]]);
  sorted.sort(function(a,b){return b[1]-a[1];});
  var p=RM[sorted[0][0]],mx=sorted[0][1];
  var bars='';
  for(var i=0;i<sorted.length;i++){
    if(sorted[i][1]<=0) continue;
    var si=RM[sorted[i][0]];
    bars+='<div class="brow"><div style="width:24px;font-size:14px;text-align:center">'+si.emoji+'</div><div style="width:56px;font-size:12px;color:'+si.color+'">'+si.name+'</div><div class="btrk"><div class="bfil" style="width:'+((sorted[i][1]/mx)*100)+'%;background:'+si.color+'"></div></div><div style="width:24px;font-size:11px;color:rgba(160,170,200,.35);text-align:right">'+sorted[i][1]+'</div></div>';
  }
  var tags='';
  for(var i=0;i<p.traits.length;i++) tags+='<span style="display:inline-block;padding:4px 12px;border-radius:16px;background:'+hexA(p.color,0.1)+';color:'+p.color+';font-size:13px;margin:0 6px 6px 0">'+p.traits[i]+'</span>';
  var funLines=p.fun.split('\n'),funH='';
  for(var i=0;i<funLines.length;i++) funH+='<div style="margin-bottom:6px">'+funLines[i]+'</div>';

  app.innerHTML='<div class="fade-up">'+
    '<div class="logo">张艺兴 · 角色宇宙</div>'+
    '<div style="text-align:center;margin-bottom:28px">'+
    '<div style="font-size:52px;margin-bottom:10px;animation:float 2.5s ease-in-out infinite">'+p.emoji+'</div>'+
    '<h1 style="font-size:28px;font-weight:700;color:'+p.color+';margin-bottom:2px">'+p.name+'</h1>'+
    '<div style="font-size:13px;color:rgba(100,60,160,.45);margin-bottom:8px">'+p.src+'</div>'+
    '<span style="display:inline-block;padding:5px 16px;background:'+hexA(p.color,0.12)+';color:'+p.color+';border-radius:20px;font-size:14px;font-weight:600">'+p.tagline+'</span></div>'+
    '<p style="font-size:15px;line-height:1.8;color:#3d1f6e;margin-bottom:20px">'+p.desc+'</p>'+
    '<div class="card"><div style="font-size:12px;color:rgba(100,60,160,.5);margin-bottom:10px">🌸 标签</div><div style="display:flex;flex-wrap:wrap">'+tags+'</div></div>'+
    '<div class="card"><div style="font-size:12px;color:rgba(100,60,160,.5);margin-bottom:10px">🐚 趣闻</div><div style="font-size:14px;line-height:1.7;color:rgba(61,31,110,.75)">'+funH+'</div></div>'+
    '<div style="margin-bottom:24px"><div style="font-size:12px;color:rgba(100,60,160,.5);margin-bottom:10px">💜 完整匹配度</div>'+bars+'</div>'+
    '<button class="rbtn" onclick="startQuiz()">🌺 再测一次</button></div>';
}

function render(){
  if(step===0) renderStart();
  else if(step<=shuffled.length) renderQuestion();
  else renderResult();
}
function startQuiz(){step=1;scores={};shuffled=shuffle(QS);render();}
function spawnHeart(e){
  var emojis=['💜','🌸','🐚','💗','🌺','✨','🪷','🐑','🌟'];
  var el=document.createElement('div');
  el.className='heart-float';
  el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
  var rect=(e&&e.currentTarget)?e.currentTarget.getBoundingClientRect():{left:window.innerWidth/2,top:window.innerHeight/2};
  el.style.left=(rect.left+Math.random()*rect.width)+'px';
  el.style.top=(rect.top+window.scrollY)+'px';
  document.body.appendChild(el);
  setTimeout(function(){el.remove();},2200);
}
function pick(i){
  var btns=document.querySelectorAll('.opt');
  for(var j=0;j<btns.length;j++){btns[j].style.pointerEvents='none';if(j===i)btns[j].classList.add('sel');}
  spawnHeart({currentTarget:btns[i]});
  var sc=shuffled[step-1].opts[i].scores;
  for(var k in sc) scores[k]=(scores[k]||0)+sc[k];
  setTimeout(function(){step++;render();},400);
}
shuffled=shuffle(QS);render();
</script>
</body>
</html>
